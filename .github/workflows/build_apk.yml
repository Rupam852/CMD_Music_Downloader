name: Build & Release Signed Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android_app
          chmod +x gradlew || true

      - name: Build Signed Release APK with Gradle
        run: |
          cd android_app
          gradle assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMD-Music-Signed-Release-APK
          path: android_app/app/build/outputs/apk/release/*.apk
          retention-days: 30
